<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebOS — macOS Sonoma Web Edition</title>
<style>
/* ============ Reset & tokens ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{
  --accent:#007aff;--accent-hi:#0a84ff;
  --red:#ff3b30;--green:#28c840;
  --text:#1d1d1f;--text-2:rgba(29,29,31,.55);--text-3:rgba(29,29,31,.32);
  --hair:rgba(0,0,0,.10);--hair-strong:rgba(0,0,0,.16);
  --glass:rgba(250,250,252,.72);--glass-strong:rgba(252,252,254,.86);--glass-bar:rgba(255,255,255,.42);
  --radius:11px;--mb-h:28px;--dock-h:66px;
  --shadow-win:0 0 0 .5px rgba(0,0,0,.22),0 12px 28px -6px rgba(0,0,0,.18),0 36px 80px -12px rgba(0,0,0,.38);
  --shadow-win-off:0 0 0 .5px rgba(0,0,0,.12),0 8px 22px -6px rgba(0,0,0,.16),0 18px 48px -12px rgba(0,0,0,.22);
  --shadow-pop:0 0 0 .5px rgba(0,0,0,.12),0 10px 40px rgba(0,0,0,.25);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--text);background:#cfd8e8;font-size:14px;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;cursor:default;text-align:left}
input,textarea{font:inherit;color:inherit;user-select:text}
input:focus,textarea:focus{outline:none}
::selection{background:rgba(0,122,255,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.34);border:2px solid transparent;background-clip:content-box}
svg{display:block}

/* ============ Wallpaper (pure CSS/SVG, Sonoma-style) ============ */
#wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   radial-gradient(1400px 900px at 88% 8%,rgba(255,213,160,.95),rgba(255,213,160,0) 62%),
   radial-gradient(1100px 850px at 8% 88%,rgba(150,199,244,.92),rgba(150,199,244,0) 62%),
   radial-gradient(950px 950px at 74% 82%,rgba(255,178,196,.78),rgba(255,178,196,0) 64%),
   radial-gradient(800px 640px at 24% 18%,rgba(214,198,250,.85),rgba(214,198,250,0) 60%),
   linear-gradient(152deg,#fdeedd 0%,#f9dce8 30%,#e3ddf3 58%,#c7dcf5 100%);
  transition:filter .5s}
body.wp-alt #wallpaper{
  background:
   radial-gradient(1300px 900px at 12% 10%,rgba(255,196,146,.85),rgba(255,196,146,0) 60%),
   radial-gradient(1100px 900px at 92% 86%,rgba(126,168,236,.9),rgba(126,168,236,0) 62%),
   radial-gradient(900px 900px at 62% 34%,rgba(232,168,208,.6),rgba(232,168,208,0) 62%),
   linear-gradient(160deg,#2e3a63 0%,#5d4a8e 34%,#b06a9a 62%,#e8a17c 88%,#f4c98d 100%)}
body.wp-alt{color:#fff}
#wp-waves{position:absolute;inset:0;width:100%;height:100%;transform:scale(1.08);filter:blur(26px) saturate(115%)}
body.wp-alt #wp-waves{opacity:.5}

/* ============ Desktop ============ */
#desktop{position:fixed;top:var(--mb-h);left:0;right:0;bottom:0;z-index:1}

/* ============ Menu bar ============ */
#menubar{position:fixed;top:0;left:0;right:0;height:var(--mb-h);z-index:8000;display:flex;align-items:center;
  background:var(--glass-bar);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 -.5px 0 rgba(0,0,0,.12);font-size:13px;color:var(--text);padding:0 8px;gap:1px}
#mb-left{display:flex;align-items:center;gap:1px;flex:1;min-width:0}
#mb-right{display:flex;align-items:center;gap:1px}
.mb-item{height:calc(var(--mb-h) - 6px);display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:5px;white-space:nowrap;color:var(--text)}
.mb-item svg{flex:none}
.mb-item:hover{background:rgba(0,0,0,.06)}
.mb-item.open{background:rgba(0,0,0,.09)}
.mb-app{font-weight:600}
#mb-apple svg{width:15px;height:15px;fill:currentColor}
#mb-wifi.off svg{opacity:.32}
.menu-dropdown{position:fixed;top:calc(var(--mb-h) + 2px);min-width:230px;padding:5px;z-index:8500;border-radius:9px;
  background:var(--glass-strong);backdrop-filter:blur(32px) saturate(180%);-webkit-backdrop-filter:blur(32px) saturate(180%);
  box-shadow:var(--shadow-pop);font-size:13px;animation:pop-in .08s ease-out}
@keyframes pop-in{from{opacity:0;transform:scale(.97) translateY(-2px)}to{opacity:1;transform:none}}
.mi{width:100%;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:3px 11px;border-radius:5px}
.mi .mi-sc{color:var(--text-3);font-size:12.5px}
.mi:hover:not(.disabled){background:var(--accent);color:#fff}
.mi:hover:not(.disabled) .mi-sc{color:rgba(255,255,255,.75)}
.mi.disabled{color:var(--text-3)}
.msep{height:1px;background:var(--hair);margin:5px 11px}

/* ============ Windows ============ */
.window{position:absolute;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;outline:none;
  background:rgba(247,247,250,.84);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  box-shadow:var(--shadow-win)}
.window.inactive{box-shadow:var(--shadow-win-off)}
.window.inactive .w-title{color:var(--text-3)}
.window.inactive .tl{background:#d9d9de}
.window.inactive .tl svg{opacity:0!important}
.window.opening{animation:win-open .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes win-open{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.titlebar{height:40px;flex:none;display:flex;align-items:center;padding:0 13px;position:relative;
  box-shadow:inset 0 -.5px 0 rgba(0,0,0,.09)}
.traffic{display:flex;gap:8px;flex:none;position:relative;z-index:2}
.tl{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.tl svg{width:8px;height:8px;opacity:0}
.traffic:hover .tl svg{opacity:.5}
.tl-close{background:#ff5f57}.tl-min{background:#febc2e}.tl-zoom{background:#28c840}
.w-title{position:absolute;left:50%;transform:translateX(-50%);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13px;font-weight:600;color:rgba(0,0,0,.78);pointer-events:none}
.w-content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.resize-h{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}

/* ============ Dock ============ */
#dock-wrap{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);z-index:8000}
#dock{display:flex;align-items:flex-end;gap:7px;padding:6px 9px;border-radius:21px;
  background:rgba(255,255,255,.34);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.55),0 .5px 1px rgba(0,0,0,.1),0 12px 34px rgba(0,0,0,.24)}
.dock-icon{width:52px;height:52px;position:relative;flex:none;transform-origin:50% 100%;transition:transform .18s ease-out;will-change:transform}
.dock-icon svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.22))}
.dock-icon .dot{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;
  background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.dock-icon.running .dot{opacity:1}
.dock-icon .tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(3px);
  padding:3px 11px;border-radius:7px;font-size:13px;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;
  background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow-pop);transition:opacity .12s,transform .12s}
.dock-icon:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ Toast / overlays ============ */
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(6px);z-index:9000;padding:9px 20px;border-radius:11px;
  background:rgba(38,38,43,.88);backdrop-filter:blur(16px);color:#fff;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;box-shadow:0 8px 26px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#dim-overlay{position:fixed;inset:0;z-index:9500;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
#sleep-overlay{position:fixed;inset:0;z-index:9800;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#sleep-overlay.on{opacity:1;pointer-events:auto}
.sleep-hint{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:14px;letter-spacing:.4px}
#shutdown-overlay{position:fixed;inset:0;z-index:9900;background:#000;display:none;align-items:center;justify-content:center}
#shutdown-overlay.on{display:flex}
.sd-inner{text-align:center}
#sd-power{width:74px;height:74px;margin:0 auto;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);color:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;transition:.2s}
#sd-power:hover{border-color:#fff;color:#fff;box-shadow:0 0 30px rgba(255,255,255,.25)}
#sd-power svg{width:32px;height:32px}
.sd-label{margin-top:22px;color:rgba(255,255,255,.85);font-size:15px;font-weight:600;letter-spacing:1.6px}

/* ============ Control Center popover ============ */
#cc-pop{position:fixed;top:calc(var(--mb-h) + 6px);right:8px;width:330px;z-index:8500;padding:12px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
  box-shadow:var(--shadow-pop);animation:pop-in .1s ease-out}
.cc-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.5);margin-bottom:9px}
.cc-item:last-child{margin-bottom:0}
.cc-ico{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.cc-ico.off{background:rgba(120,120,128,.32)}
.cc-ico svg{width:17px;height:17px}
.cc-txt{flex:1;min-width:0}
.cc-txt b{display:block;font-size:13.5px;font-weight:600}
.cc-txt span{display:block;font-size:11.5px;color:var(--text-2)}
.cc-col{flex-direction:column;align-items:stretch;gap:9px}
.cc-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.cc-head .cc-mini{width:18px;height:18px;color:var(--text-2)}
input[type=range]{width:100%;accent-color:var(--accent)}
.cc-walls{display:flex;gap:9px}
.cc-wall{width:64px;height:40px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);position:relative}
.cc-wall.w1{background:linear-gradient(150deg,#fdeedd,#f6d7e6 40%,#d9d8f2 70%,#bcd9f6)}
.cc-wall.w2{background:linear-gradient(160deg,#2e3a63,#5d4a8e 40%,#b06a9a 70%,#f0b57e)}
.cc-wall.on{box-shadow:0 0 0 2px var(--accent)}

/* Switch */
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .knob{position:absolute;inset:0;border-radius:13px;background:rgba(120,120,128,.28);transition:.2s}
.switch .knob:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;top:2px;left:2px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked + .knob{background:var(--green)}
.switch input:checked + .knob:before{transform:translateX(16px)}

/* ============ Generic controls ============ */
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 13px;border-radius:7px;background:rgba(120,120,128,.14);
  font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:rgba(120,120,128,.22)}
.btn:active{background:rgba(120,120,128,.3)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi)}
.btn svg{width:13px;height:13px}
.icon-btn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:hover{background:rgba(120,120,128,.16);color:var(--text)}
.icon-btn svg{width:16px;height:16px}
.sheet{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet-card{width:72%;max-height:72%;display:flex;flex-direction:column;border-radius:13px;overflow:hidden;
  background:var(--glass-strong);backdrop-filter:blur(30px);box-shadow:var(--shadow-pop)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;box-shadow:inset 0 -.5px 0 var(--hair)}
.sheet-head b{font-size:13.5px}
.sheet-list{overflow:auto;padding:6px}
.file-row{width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:13.5px}
.file-row:hover{background:rgba(0,0,0,.05)}
.file-row svg{width:22px;height:22px;flex:none}
.file-row small{margin-left:auto;color:var(--text-2);font-size:11.5px}
.empty-note{padding:22px;text-align:center;color:var(--text-2);font-size:13px}

/* ============ Calculator ============ */
.calc{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(238,238,241,.55)}
.calc-display{min-height:88px;padding:10px 18px 6px;display:flex;align-items:flex-end;justify-content:flex-end;
  font-size:46px;font-weight:200;letter-spacing:.5px;overflow:hidden;white-space:nowrap}
.calc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair-strong);border-top:.5px solid var(--hair)}
.ck{display:flex;align-items:center;justify-content:center;font-size:21px;background:#e8e8eb;transition:filter .06s}
.ck:hover{filter:brightness(.95)}
.ck:active{filter:brightness(.86)}
.ck.fn{background:#d3d3d7;font-size:19px}
.ck.op{background:#ff9f0a;color:#fff;font-size:26px}
.ck.zero{grid-column:span 2}

/* ============ Text editor ============ */
.editor{flex:1;display:flex;flex-direction:column;min-height:0}
.editor-toolbar{height:42px;flex:none;display:flex;align-items:center;gap:7px;padding:0 12px;box-shadow:inset 0 -.5px 0 var(--hair)}
.editor-toolbar .sep{width:1px;height:16px;background:var(--hair);margin:0 3px}
.editor-area{flex:1;min-height:0;resize:none;border:0;background:rgba(255,255,255,.62);padding:16px 22px;
  font-size:14px;line-height:1.65;color:var(--text)}
.editor-area::placeholder{color:var(--text-3)}
.editor-status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 13px;font-size:11.5px;color:var(--text-2);
  box-shadow:inset 0 .5px 0 var(--hair)}
.editor-status .saved{color:var(--green)}

/* ============ Calendar ============ */
.cal{flex:1;display:flex;flex-direction:column;min-height:0}
.cal-head{height:54px;flex:none;display:flex;align-items:center;padding:0 15px;gap:6px}
.cal-title{flex:1;text-align:center;font-size:19px;font-weight:700;letter-spacing:-.2px}
.cal-weekdays{flex:none;display:grid;grid-template-columns:repeat(7,1fr);padding:0 9px 5px;font-size:11px;color:var(--text-2);text-align:center}
.cal-days{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;padding:0 7px 9px;column-gap:2px}
.cal-day{display:flex;align-items:flex-start;justify-content:center;padding-top:5px;border-radius:7px}
.cal-day:hover{background:rgba(0,0,0,.045)}
.cal-day .num{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.cal-day.other .num{color:var(--text-3)}
.cal-day.today .num{background:var(--red);color:#fff}
.cal-day.sel .num{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(0,122,255,.35)}
.cal-day.today.sel .num{background:var(--accent)}

/* ============ About / Help ============ */
.about{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;text-align:center;overflow:auto}
.about .a-icon svg{width:84px;height:84px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.about h2{font-size:19px;margin-top:8px}
.about .a-sub{color:var(--text-2);font-size:13px}
.about .a-rows{width:100%;max-width:250px;margin-top:12px;font-size:12.5px}
.about .a-row{display:flex;justify-content:space-between;padding:5px 2px;box-shadow:inset 0 .5px 0 var(--hair)}
.about .a-row span:first-child{color:var(--text-2)}
.help{flex:1;overflow:auto;padding:18px 24px;font-size:13.5px;line-height:1.7}
.help h3{font-size:14.5px;margin:12px 0 4px}
.help h3:first-child{margin-top:0}
.help p{color:var(--text);margin-bottom:4px}
.help .h-k{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(120,120,128,.16);font-size:12px;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}

/* ============ File Manager ============ */
.fm{flex:1;display:flex;min-height:0}
.fm-side{width:170px;flex:none;padding:8px 8px;overflow:auto;border-right:.5px solid var(--hair);background:rgba(246,246,248,.6)}
.fm-side h4{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.4px;margin:10px 8px 4px}
.fm-side button{display:flex;align-items:center;gap:7px;width:100%;padding:5px 8px;border-radius:7px;font-size:13px}
.fm-side button:hover{background:rgba(0,0,0,.05)}
.fm-side button.on{background:rgba(0,122,255,.13)}
.fm-side button.on, .fm-side button.on svg{color:var(--accent)}
.fm-side svg{width:16px;height:16px;flex:none}
.fm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fm-bar{display:flex;align-items:center;gap:3px;padding:5px 10px;border-bottom:.5px solid var(--hair);background:rgba(250,250,252,.55)}
.fm-bar .sep{width:.5px;height:16px;background:var(--hair);margin:0 5px}
.fm-path{display:flex;align-items:center;gap:1px;margin-left:6px;overflow:hidden;white-space:nowrap;min-width:0}
.fm-path button{padding:2px 5px;border-radius:5px;font-size:12.5px;color:var(--text-2);flex:none}
.fm-path button:hover{background:rgba(0,0,0,.06);color:var(--text)}
.fm-path button:last-child{color:var(--text)}
.fm-sep{color:var(--text-3);font-size:12px;flex:none}
.fm-list{flex:1;overflow:auto;padding:4px 6px}
.fm-cols{display:grid;grid-template-columns:1fr 92px 84px;gap:8px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--text-2);position:sticky;top:0;background:rgba(250,250,252,.94);border-bottom:.5px solid var(--hair)}
.fm-row{display:grid;grid-template-columns:1fr 92px 84px;gap:8px;align-items:center;padding:5px 10px;border-radius:8px;font-size:13px}
.fm-row:hover{background:rgba(0,0,0,.045)}
.fm-row.sel{background:rgba(0,122,255,.14)}
.fm-name{display:flex;align-items:center;gap:8px;min-width:0}
.fm-name svg{width:20px;height:20px;flex:none}
.fm-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-kind,.fm-size{color:var(--text-2);font-size:12px}
.fm-status{display:flex;gap:10px;padding:5px 12px;font-size:11.5px;color:var(--text-2);border-top:.5px solid var(--hair);background:rgba(250,250,252,.6)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{background:#e5342a}
.dlg{width:300px}
.dlg-body{padding:14px}
.dlg-body p{font-size:12px;color:var(--text-2);margin-bottom:6px}
.dlg-body input{width:100%;height:28px;border:.5px solid var(--hair-strong);border-radius:7px;padding:0 9px;font-size:13px;background:#fff}
.dlg-body input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:11px 14px;box-shadow:inset 0 .5px 0 var(--hair)}

/* ============ Paint ============ */
.pt{flex:1;display:flex;flex-direction:column;min-height:0}
.pt-bar{display:flex;align-items:center;gap:5px;padding:6px 10px;flex:none;flex-wrap:wrap;
  border-bottom:.5px solid var(--hair);background:rgba(250,250,252,.6)}
.pt-bar .sep{width:.5px;height:18px;background:var(--hair);margin:0 3px}

    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (k === "style") n.style.cssText = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}

const Sound = (() => {
  let ctx = null;

    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }

    open()  { tone(520, 0.09, "sine", 0.04); tone(780, 0.11, "sine", 0.035, 0.05); },

};
Store.load();

  KEY: "webos.vfs.v1",
  root: null,
  fresh() {
    return {
      name: "Macintosh HD", type: "folder", children: [
        { name: "Documents", type: "folder", children: [
          { name: "Welcome.txt", type: "txt", content: "Welcome to WebOS!\n\nThis entire desktop — wallpaper, menu bar, dock, windows and every app — lives inside one single HTML file with zero external resources.\n\nThings to try:\n- Drag windows by their title bar; double-click a title bar to zoom.\n- Use the traffic-light buttons to close, minimize and zoom.\n- Open Terminal and type help.\n- Doodle something in Paint.\n- Everything you save is kept in localStorage." },

        ]},

  },
  load() {
    try { const raw = localStorage.getItem(this.KEY); if (raw) this.root = JSON.parse(raw); } catch (e) {}

  },

function vfsFind(path) {           // path = array like ["Documents","Welcome.txt"]
  let node = VFS.root;
  for (const seg of path) {
    if (!node.children) return null;
    node = node.children.find(c => c.name === seg);
    if (!node) return null;
  }
  return node;
}
function vfsParent(path) { return vfsFind(path.slice(0, -1)); }
function vfsUniqueName(folder, base, ext) {
  const exists = n => folder.children.some(c => c.name === n);
  if (!exists(base + ext)) return base + ext;
  let i = 2; while (exists(base + " " + i + ext)) i++;
  return base + " " + i + ext;
}

   ================================================================ */
const WM = {
  zTop: 100, windows: new Map(), seq: 0,

    const top = 40 /* menubar */, bottom = 86 /* dock clearance */;

  },

    const b = this.bounds();
    let w = Math.min(app.width || 560, b.w), h = Math.min(app.height || 400, b.h);
    const openCount = Array.from(this.windows.values()).filter(x => x.appId === appId).length;
    let x = b.x + Math.max(0, (b.w - w) / 2) + (openCount % 5) * 26 - 52;
    let y = b.y + Math.max(0, (b.h - h) / 2.4) + (openCount % 5) * 22 - 44;
    x = Math.max(b.x, x); y = Math.max(b.y, y);
    const root = el("section", { class: "window opening", id: id, tabindex: "-1", style: `left:${x}px;top:${y}px;width:${w}px;height:${h}px` });
    root.innerHTML =
      '<div class="titlebar">' +
        '<div class="traffic">' +
          '<button class="tl tl-close" aria-label="Close">' + ICONS.close + "</button>" +
          '<button class="tl tl-min" aria-label="Minimize">' + ICONS.min + "</button>" +
          '<button class="tl tl-zoom" aria-label="Zoom">' + ICONS.zoom + "</button>" +
        "</div>" +
        '<div class="w-title">' + esc(app.title) + "</div>" +
      "</div>" +
      '<div class="w-content"></div>' +
      '<div class="resize-h"></div>';
    $("#desktop").append(root);
    const win = { id, appId, el: root, x, y, w, h, minimized: false, restore: null, title: app.title,
      setTitle(t) { this.title = t; root.querySelector(".w-title").textContent = t; Shell.syncMenuTitles(); } };
    this.windows.set(id, win);
    root.addEventListener("mousedown", () => this.focus(win), true);
    root.querySelector(".tl-close").addEventListener("click", e => { e.stopPropagation(); this.close(win); });
    root.querySelector(".tl-min").addEventListener("click", e => { e.stopPropagation(); this.minimize(win); });
    root.querySelector(".tl-zoom").addEventListener("click", e => { e.stopPropagation(); this.zoom(win); });
    this.makeDraggable(win);
    this.makeResizable(win);
    try { app.mount(root.querySelector(".w-content"), win); } catch (err) { console.error(err); }
    this.focus(win);
    Sound.open();
    Dock.update();
    setTimeout(() => root.classList.remove("opening"), 260);
    return win;
  },
  close(win) {
    if (!win) return;
    const app = Apps[win.appId];
    if (app && app.onClose) try { app.onClose(win); } catch (e) {}
    win.el.remove();
    this.windows.delete(win.id);
    Sound.close();
    const next = this.topWin();
    Shell.setActive(next ? next.appId : null);
    Dock.update();
  },
  minimize(win) {
    if (!win || win.minimized) return;
    win.minimized = true;
    win.el.style.display = "none";
    Sound.minimize();
    const next = this.topWin();
    Shell.setActive(next ? next.appId : null);
    Dock.update();
  },
  unminimize(win) {
    win.minimized = false;
    win.el.style.display = "";
    this.focus(win);
    Sound.open();
    Dock.update();
  },
  zoom(win) {
    if (win.restore) {
      const r = win.restore; win.restore = null;
      this.applyGeom(win, r.x, r.y, r.w, r.h);
    } else {
      win.restore = { x: win.x, y: win.y, w: win.w, h: win.h };
      const b = this.bounds();
      this.applyGeom(win, b.x + 12, b.y + 6, b.w - 24, b.h - 12);
    }
    win.onResize && win.onResize();
  },
  applyGeom(win, x, y, w, h) {
    win.x = x; win.y = y; win.w = w; win.h = h;
    win.el.style.left = x + "px"; win.el.style.top = y + "px";
    win.el.style.width = w + "px"; win.el.style.height = h + "px";
  },
  makeDraggable(win) {
    const bar = win.el.querySelector(".titlebar");
    bar.addEventListener("mousedown", e => {
      if (e.target.closest(".tl")) return;
      if (e.detail === 2) { this.zoom(win); return; }   // double-click zoom
      const sx = e.clientX, sy = e.clientY, ox = win.x, oy = win.y;
      win.el.style.transition = "none";
      const mv = ev => {
        const p = this.clampXy(win, ox + ev.clientX - sx, oy + ev.clientY - sy);
        win.x = p.x; win.y = p.y;
        win.el.style.left = p.x + "px"; win.el.style.top = p.y + "px";
      };
      const up = () => {
        removeEventListener("mousemove", mv); removeEventListener("mouseup", up);
        win.el.style.transition = "";
      };
      addEventListener("mousemove", mv); addEventListener("mouseup", up);
      e.preventDefault();
    });
  },
  makeResizable(win) {
    const grip = win.el.querySelector(".resize-h");
    grip.addEventListener("mousedown", e => {
      const sx = e.clientX, sy = e.clientY, ow = win.w, oh = win.h;
      const minW = Apps[win.appId].minW || 320, minH = Apps[win.appId].minH || 220;
      const mv = ev => {
        const w = Math.max(minW, Math.min(ow + ev.clientX - sx, window.innerWidth - win.x - 4));
        const h = Math.max(minH, Math.min(oh + ev.clientY - sy, window.innerHeight - win.y - 4));
        win.w = w; win.h = h;
        win.el.style.width = w + "px"; win.el.style.height = h + "px";
        win.onResize && win.onResize();
      };
      const up = () => { removeEventListener("mousemove", mv); removeEventListener("mouseup", up); };
      addEventListener("mousemove", mv); addEventListener("mouseup", up);
      e.stopPropagation(); e.preventDefault();
    });
  }
};

const Dock = {
  order: ["files", "editor", "terminal", "paint", "video", "calendar", "calc", "trash"],
  init() {
    const dock = $("#dock");
    dock.innerHTML = "";
    for (const id of this.order) {
      const app = id === "trash" ? TRASH_APP : Apps[id];
      if (!app) continue;
      const btn = el("button", { class: "dock-icon", "aria-label": app.title, title: "" },
        el("span", { class: "tip" }, app.title),
        el("span", { html: app.icon }),
        el("span", { class: "dot" })
      );
      btn.dataset.app = id;
      btn.addEventListener("click", () => {
        Sound.click();
        const win = Array.from(WM.windows.values()).filter(w => w.appId === id).sort((a, b) => (b.el.style.zIndex || 0) - (a.el.style.zIndex || 0))[0];
        if (!win) { id === "trash" ? toast("Trash is empty") : WM.open(id); return; }
        if (win.minimized) WM.unminimize(win);
        else if (WM.topWin() === win && !win.minimized) WM.minimize(win);
        else WM.focus(win);
      });
      dock.append(btn);
    }
    this.update();
    this.magnify();
  },
  update() {
    const running = new Set(Array.from(WM.windows.values()).map(w => w.appId));
    $$(".dock-icon").forEach(btn => btn.classList.toggle("running", running.has(btn.dataset.app)));
  },
  magnify() {
    const dock = $("#dock");
    dock.addEventListener("mousemove", e => {
      const icons = $$(".dock-icon", dock);
      for (const ic of icons) {
        const r = ic.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const d = Math.abs(e.clientX - cx);
        const s = d < 140 ? 1 + 0.55 * Math.pow(Math.cos((Math.min(d, 140) / 140) * (Math.PI / 2)), 2.2) : 1;
        ic.style.transform = "scale(" + s.toFixed(3) + ")";
      }
    });
    dock.addEventListener("mouseleave", () => $$(".dock-icon", dock).forEach(ic => ic.style.transform = ""));
  }
};

  mount(root, win) {
    const state = { acc: null, op: null, cur: "0", fresh: true, lastOp: null, repeatAcc: null };
    const disp = el("div", { class: "calc-display", role: "status", "aria-live": "polite" }, "0");
    const fmt = (numStr) => {
      if (numStr === "Error") return "Error";
      const n = Number(numStr);

      if (Math.abs(n) >= 1e12 || (n !== 0 && Math.abs(n) < 1e-9)) return n.toExponential(6).replace(/(\.\d*?)0+e/, "$1e").replace(/\.e/, "e");

      if (state.cur === "Error") state.cur = "0";
      if (state.fresh) { state.cur = d === "." ? "0." : d; state.fresh = false; }
      else {

        if (state.cur.replace(/[-.]/g, "").length >= 12) return;
        state.cur = state.cur === "0" && d !== "." ? d : state.cur + d;
      }
    }
    function setOp(op) {
      if (state.cur === "Error") return;
      const cur = Number(state.cur);
      if (state.op && !state.fresh) {

        if (!isFinite(r)) { state.cur = "Error"; state.op = null; state.acc = null; show(); return; }

      else return;
      const r = apply(state.acc, state.repeatAcc !== null && state.lastOp ? state.repeatAcc : b, state.lastOp);
      if (!isFinite(r)) { state.cur = "Error"; state.op = null; state.acc = null; show(); return; }
      state.cur = String(r); state.acc = null; state.op = null; state.fresh = true;
    }
    function clearAll() { Object.assign(state, { acc: null, op: null, cur: "0", fresh: true, lastOp: null, repeatAcc: null }); show(); }
    win.calc = { reset: clearAll };
    function press(k) {
      Sound.click();
      if (/^[0-9.]$/.test(k)) digit(k);
      else if (["+", "−", "×", "÷"].includes(k)) setOp(k);

    row.append(ps1, input);

    let buffer = [];
    const history = [];
    let hIx = -1;

    function echo(text, cls) {
      const pre = el("div", { class: "tm-line " + (cls || "") });
      pre.textContent = text;
      out.append(pre);
      body.scrollTop = body.scrollHeight;
    }
    function echoPromptLine(prompt, line) { echo(prompt + " " + line, "in"); }

    function result(v) {
      if (v === undefined) return;
      echo(toReprProxy(v), "res");
    }
    function toReprProxy(v) { return PyMini.toRepr(v); }

    function resetPrompt() {
      ps1.textContent = buffer.length ? "..." : ">>>";
      input.value = "";
      body.scrollTop = body.scrollHeight;
      input.focus();
    }

    function submit(line) {
      echoPromptLine(buffer.length ? "..." : ">>>", line);
      if (line.trim() === "" && buffer.length === 0) { resetPrompt(); return; }
      if (line.trim() === "") {
        const src = buffer.join("\n");
        buffer = [];
        try { interp.run(src); }
        catch (ex) { reportError(ex); }
        resetPrompt();
        return;
      }
      buffer.push(line);
      const src = buffer.join("\n");
      // 1) completeness probe: fresh parse
      let prog = null;
      try {
        prog = PyMini.parse(src);
      } catch (ex) {
        if (ex && ex.incomplete) { resetPrompt(); return; }   // keep buffering, show "..."
        buffer.pop();
        reportError(ex);
        buffer = [];
        resetPrompt();
        return;
      }
      buffer = [];
      try {
        const v = interp.run(src);
        const lastStmt = prog[prog.length - 1];
        if (v !== null && v !== undefined && lastStmt && lastStmt.k === "exprstmt") result(v);
      } catch (ex) { reportError(ex); }
      resetPrompt();
    }

    function reportError(ex) {

      if (e.key === "Enter") {

        if (line.trim() !== "") { history.push(line); }
        hIx = history.length;
        submit(line);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (hIx > 0) { hIx--; input.value = history[hIx] || ""; }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (hIx < history.length) { hIx++; input.value = history[hIx] || ""; }
      } else if (e.key === "c" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        echoPromptLine(ps1.textContent, input.value + "^C");
        buffer = [];
        resetPrompt();
      }
    });
    body.addEventListener("mouseup", () => { if (!getSelection().toString()) input.focus(); });

    win.tmClear = () => { out.innerHTML = ""; echo(TM_BANNER.trimEnd(), "out"); };
    win.tmReset = () => { interp = new PyMini.Interp(line => echo(line, "out")); buffer = []; resetPrompt(); toast("Terminal session reset"); };
    win.tmDemo = () => {

      try {
        const v = interp.run(TM_DEMO);
        if (v !== null && v !== undefined) result(v);
      } catch (ex) { reportError(ex); }
      resetPrompt();
    };

    echo(TM_BANNER.trimEnd(), "out");
    setTimeout(() => input.focus(), 0);
  }

    let selected = null;

    const side = el("div", { class: "fm-side" });
    const crumbs = el("div", { class: "fm-path" });
    const list = el("div", { class: "fm-list" });
    const status = el("div", { class: "fm-status" });

    function curFolder() { return vfsFind(path) || VFS.root; }

    function navigate(p, remember) {
      if (remember && String(p) !== String(path)) { back.push(path); fwd.length = 0; }
      path = p; selected = null; renderAll();
    }

    function askName(head, initial, okLabel, cb) {
      const input = el("input", { type: "text", value: initial, spellcheck: "false" });
      const ok = () => { const v = input.value.trim(); if (!v) return; ov.remove(); cb(v); };
      const card = el("div", { class: "sheet-card dlg" },
        el("div", { class: "sheet-head" }, el("b", {}, head)),
        el("div", { class: "dlg-body" }, el("p", {}, "Name:"), input),
        el("div", { class: "dlg-foot" },
          el("button", { class: "btn", onclick: () => ov.remove() }, "Cancel"),
          el("button", { class: "btn primary", onclick: ok }, okLabel)));
      const ov = el("div", { class: "sheet" }, card);
      input.addEventListener("keydown", e => {
        e.stopPropagation();
        if (e.key === "Enter") ok();
        else if (e.key === "Escape") ov.remove();
      });
      root.append(ov);
      setTimeout(() => { input.focus(); input.select(); }, 30);
    }

    function confirmDelete(name, cb) {
      const card = el("div", { class: "sheet-card dlg" },
        el("div", { class: "sheet-head" }, el("b", {}, 'Delete "' + name + '"')),
        el("div", { class: "dlg-body" }, el("p", {}, "This item will be removed from this Mac. This cannot be undone.")),
        el("div", { class: "dlg-foot" },
          el("button", { class: "btn", onclick: () => ov.remove() }, "Cancel"),
          el("button", { class: "btn danger", onclick: () => { ov.remove(); cb(); } }, "Delete")));
      const ov = el("div", { class: "sheet" }, card);
      root.append(ov);
    }

    function nameTaken(folder, name) { return folder.children.some(c => c.name === name); }

    win.fmNewFolder = () => askName("New Folder", vfsUniqueName(curFolder(), "untitled folder", ""), "Create", name => {
      curFolder().children.push({ name: name, type: "folder", children: [] });
      VFS.save(); selected = name; renderAll(); toast('Folder "' + name + '" created');
    });

    win.fmNewFile = () => askName("New Text File", vfsUniqueName(curFolder(), "untitled", ".txt"), "Create", raw => {
      const name = raw.includes(".") ? raw : raw + ".txt";
      if (nameTaken(curFolder(), name)) { toast("That name is already taken"); return; }
      curFolder().children.push({ name: name, type: "txt", content: "" });
      VFS.save(); selected = name; renderAll(); toast('File "' + name + '" created');
    });

    win.fmRename = () => {
      if (!selected) { toast("Select an item first"); return; }
      const old = selected;
      askName("Rename", old, "Rename", name => {
        const node = curFolder().children.find(c => c.name === old);
        if (!node) return;
        if (name !== old && nameTaken(curFolder(), name)) { toast("That name is already taken"); return; }
        node.name = name; VFS.save(); selected = name; renderAll(); toast("Renamed to " + name);
      });
    };

    win.fmDelete = () => {
      if (!selected) { toast("Select an item first"); return; }
      const name = selected;
      confirmDelete(name, () => {
        const f = curFolder();
        f.children = f.children.filter(c => c.name !== name);
        VFS.save(); selected = null; renderAll(); toast('"' + name + '" deleted');
      });
    };

    function renderSide() {
      side.innerHTML = "";
      side.append(el("h4", {}, "Favorites"));
      for (const f of (VFS.root.children || []).filter(c => c.type === "folder")) {
        side.append(el("button", {
          class: path.length === 1 && path[0] === f.name ? "on" : "",
          html: ICONS.folder, onclick: () => navigate([f.name], true)
        }, f.name));
      }
      side.append(el("h4", {}, "Locations"));
      side.append(el("button", {
        class: path.length === 0 ? "on" : "",
        html: DRIVE_SVG, onclick: () => navigate([], true)
      }, "Macintosh HD"));
    }

    function renderCrumbs() {
      crumbs.innerHTML = "";
      const seg = (label, p) => {
        crumbs.append(el("button", { onclick: () => navigate(p, true) }, label));
      };
      seg("Macintosh HD", []);
      path.forEach((s, i) => {
        crumbs.append(el("span", { class: "fm-sep" }, "›"));
        seg(s, path.slice(0, i + 1));
      });
    }

    function renderList() {
      list.innerHTML = "";
      const kids = (curFolder().children || []).slice().sort((a, b) =>
        a.type === b.type ? a.name.localeCompare(b.name) : (a.type === "folder" ? -1 : 1));
      status.textContent = kids.length + (kids.length === 1 ? " item" : " items") + (selected ? ", 1 selected" : "");
      if (!kids.length) { list.append(el("div", { class: "empty-note" }, "This folder is empty")); return; }
      list.append(el("div", { class: "fm-cols" },
        el("span", {}, "Name"), el("span", {}, "Kind"), el("span", {}, "Size")));
      for (const node of kids) {
        const row = el("div", {
          class: "fm-row" + (node.name === selected ? " sel" : ""),
          role: "button", tabindex: "0",
          "aria-label": node.name
        },
          el("div", { class: "fm-name", html: node.type === "folder" ? ICONS.folder : ICONS.fileText }, el("span", {}, node.name)),
          el("span", { class: "fm-kind" }, node.type === "folder" ? "Folder" : "Plain Text"),
          el("span", { class: "fm-size" }, node.type === "folder" ? (node.children || []).length + " items" : (node.content || "").length + " bytes"));
        row.addEventListener("click", () => {
          selected = node.name;
          $$(".fm-row", list).forEach(r => r.classList.remove("sel"));
          row.classList.add("sel");
          status.textContent = kids.length + (kids.length === 1 ? " item" : " items") + ", 1 selected";
        });
        row.addEventListener("dblclick", () => openNode(node));
        row.addEventListener("keydown", e => { if (e.key === "Enter") openNode(node); });
        list.append(row);
      }
    }

    function openNode(node) {
      if (node.type === "folder") { navigate(path.concat(node.name), true); return; }
      openInTextEditor(node.name, node.content || "");
      toast('Opening "' + node.name + '" in TextEdit');
    }

    function renderAll() { renderSide(); renderCrumbs(); renderList(); }

    const btnBack = el("button", { class: "icon-btn", html: ICONS.chevL, "aria-label": "Back" });
    btnBack.addEventListener("click", () => { if (back.length) { fwd.push(path); path = back.pop(); selected = null; renderAll(); } });
    const btnFwd = el("button", { class: "icon-btn", html: ICONS.chevR, "aria-label": "Forward" });
    btnFwd.addEventListener("click", () => { if (fwd.length) { back.push(path); path = fwd.pop(); selected = null; renderAll(); } });
    const btnNF = el("button", { class: "icon-btn", html: ICONS.newFolder, "aria-label": "New folder" });
    btnNF.addEventListener("click", () => win.fmNewFolder());
    const btnNT = el("button", { class: "icon-btn", html: ICONS.newFile, "aria-label": "New text file" });
    btnNT.addEventListener("click", () => win.fmNewFile());
    const btnRe = el("button", { class: "icon-btn", html: PENCIL_SVG, "aria-label": "Rename" });
    btnRe.addEventListener("click", () => win.fmRename());
    const btnDe = el("button", { class: "icon-btn", html: ICONS.trash, "aria-label": "Delete" });
    btnDe.addEventListener("click", () => win.fmDelete());

    root.append(el("div", { class: "fm" },
      side,
      el("div", { class: "fm-main" },
        el("div", { class: "fm-bar" }, btnBack, btnFwd, crumbs,
          el("span", { class: "sep" }), btnNF, btnNT, btnRe, btnDe),
        list, status)));

    root.tabIndex = 0;
    root.addEventListener("keydown", e => {
      if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); win.fmDelete(); }
    });

    renderAll();
  }
};


/* ================================================================
   Boot
   ================================================================ */
(function boot() {
  Shell.init();
  Dock.init();
  window.addEventListener("resize", () => {
    for (const w of WM.windows.values()) {
      const p = WM.clampXy(w, w.x, w.y);
      w.x = p.x; w.y = p.y;
      w.el.style.left = p.x + "px"; w.el.style.top = p.y + "px";
    }
  });
  document.addEventListener("contextmenu", e => e.preventDefault());
  toast("Welcome to WebOS");
})();
</script>
</body>
</html>
